# 퇴마 서바이버 안드로이드 빌드: GitHub 저장소 → Actions → "Android build" → Run workflow
# 결과: 아티팩트 toema-android (Play Console 업로드용 .aab + 폰 설치 테스트용 .apk)
name: Android build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Check signing secrets
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::GitHub Secrets 에 ANDROID_KEYSTORE_BASE64 가 없어요 (app/README.md 참고)"; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Install Capacitor
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Copy game files
        working-directory: app
        run: node scripts/prepare-web.mjs
      - name: Create Android project
        working-directory: app
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#14111c' --iconBackgroundColorDark '#14111c' --splashBackgroundColor '#14111c' --splashBackgroundColorDark '#14111c'
          npx cap sync android
      - name: Patch for release
        working-directory: app
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: node scripts/patch-android.mjs
      - name: Build AAB + APK
        working-directory: app/android
        env:
          KS_PATH: ${{ runner.temp }}/upload.jks
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: toema-android-${{ github.run_number }}
          path: |
            app/android/app/build/outputs/bundle/release/*.aab
            app/android/app/build/outputs/apk/release/*.apk
          retention-days: 14

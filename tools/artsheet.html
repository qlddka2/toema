<!doctype html><html><body style="background:#2f4a2c;margin:0"><canvas id=c width=900 height=520></canvas>
<script src="../js/data.js"></script><script src="../js/core.js"></script><script src="../js/art.js"></script>
<script>
ART.setDpr(2);const c=document.getElementById('c'),x=c.getContext('2d');
let X=40,Y=50;
for(const t of ['daesung','uchi','dog','wolf','boar','crow','bat','snake','bear','buffalo']){for(const f of [0,1]){const s=ART.sprite(t,f,false);x.drawImage(s.cv,X-s.sz,Y-s.sz,s.sz*2,s.sz*2);X+=s.sz*2+6;if(X>840){X=40;Y+=100}}}
X=60;Y=290;for(const t of ['tiger','fox','bulga','imugi']){const s=ART.sprite(t,0,false);x.drawImage(s.cv,X-s.sz,Y-s.sz,s.sz*2,s.sz*2);X+=s.sz*2+20}
for(let i=0;i<5;i++){const s=ART.seg(i);x.drawImage(s.cv,700+i*30-20,300-20,80,80)}
X=30;Y=440;for(const id of ['staff','talisman','thunder','beads','aura','fan','might','haste','vigor','swift','magnet','regen','heal','gold']){x.drawImage(ART.icon(id,44),X,Y,44,44);X+=50}
X=740;for(const k of ['heal','magnet','coin','bag','chest']){x.drawImage(ART.drop(k),X,380,32,32);X+=30}
</script></body></html>

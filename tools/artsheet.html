<!doctype html><html><body style="background:#3a5a33;margin:0"><canvas id=c width=1000 height=700></canvas>
<script src="../js/data.js"></script><script src="../js/core.js"></script><script src="../js/art.js"></script>
<script>
ART.setDpr(2);
ART.loadImages('../img/',()=>{const c=document.getElementById('c'),x=c.getContext('2d');
let X=40,Y=50;const put=(s,sc=1.4)=>{x.drawImage(s.cv,X-s.sz*sc/2,Y-s.sz*sc/2,s.sz*sc,s.sz*sc);X+=s.sz*sc+8;if(X>940){X=40;Y+=95}};
for(const t of ['daesung','uchi','bari','gildong','gangrim','seolmun'])put(ART.sprite(t,0));
X=40;Y+=95;for(const [t,ti] of [['dog'],['crow'],['boar'],['bear'],['wolf','frost'],['crow','fire'],['bat','sea'],['bear','sea'],['snake','sea'],['buffalo','fire']])put(ART.sprite(t,0,false,ti),1.2);
X=60;Y+=120;for(const t of ['haetae','baekho','hwaseo','jujak'])put(ART.sprite(t,0),1.3);
X=60;Y+=140;for(const t of ['hyeonmu','cheongryong','tiger','fox'])put(ART.sprite(t,0),1.3);
X=30;Y=650;for(const id of ['bell','knives','soulfire','quake','armor','luck'])x.drawImage(ART.icon(id,44,id==='bell'),X+=50,Y-22,44,44);
document.title='done'});
</script></body></html>
